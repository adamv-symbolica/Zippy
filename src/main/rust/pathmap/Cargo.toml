[package]
name = "zippy-pathmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
# PR #171 includes focus-value consistency, pruned Zippy laws and native tails meet.
pathmap = { git = "https://github.com/Adam-Vandervorst/PathMap", rev = "f3e442ed19025582aced71c598a0359b3b469e45", default-features = false, features = ["slim_ptrs"] }
num-bigint = "0.4"
num-traits = "0.2"
smallvec = "1.15"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1

[workspace]
