[package]
name = "zippy-pathmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
# PR #171 plus the PR #172 sparse restriction fix; provenance lives beside source.
pathmap = { path = "vendor/pathmap", default-features = false, features = ["slim_ptrs"] }
num-bigint = "0.4"
num-traits = "0.2"
smallvec = "1.15"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1

[workspace]
